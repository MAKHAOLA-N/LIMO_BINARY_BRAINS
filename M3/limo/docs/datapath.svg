<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" font-family="Arial, Helvetica, sans-serif" font-size="11">
  <title>LIMO five-stage pipelined datapath</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .u { fill: #eef2ff; stroke: #1f3a8a; stroke-width: 1.6; }
      .m { fill: #f1f5f9; stroke: #1f3a8a; stroke-width: 1.4; }
      .p { fill: #fde68a; stroke: #92400e; stroke-width: 1.4; }
      .w { fill: none; stroke: #334155; stroke-width: 1.4; marker-end: url(#a); }
      .t { fill: #0f172a; text-anchor: middle; font-weight: bold; }
      .s { fill: #0f172a; text-anchor: middle; font-size: 9.5px; }
      .l { fill: #475569; font-size: 9.5px; }
      .g { fill: #92400e; text-anchor: middle; font-weight: bold; font-size: 10px; }
      .st { fill: #1f3a8a; text-anchor: middle; font-weight: bold; font-size: 14px; }
    </style>
  </defs>
  <rect width="1000" height="515" fill="#ffffff"/>

  <!-- ===== Wires (drawn first, under the boxes) ===== -->
  <!-- branch target back to PC mux (PCSrc) -->
  <polyline class="w" points="683,95 695,95 695,25 6,25 6,250 15,250"/>
  <text class="l" x="300" y="20">branch target (chosen when PCSrc = 1, branch taken)</text>
  <!-- PC+4 back to PC mux -->
  <polyline class="w" points="200,95 200,140 10,140 10,220 15,220"/>
  <text class="l" x="100" y="136">PC+4</text>
  <!-- mux -> PC, PC -> instr mem, PC -> adder -->
  <line class="w" x1="37" y1="235" x2="50" y2="235"/>
  <line class="w" x1="95" y1="235" x2="115" y2="235"/>
  <polyline class="w" points="72,205 72,95 115,95"/>
  <!-- IF -> IF/ID -->
  <line class="w" x1="175" y1="95" x2="235" y2="95"/>
  <text class="l" x="205" y="90">PC+4</text>
  <line class="w" x1="210" y1="235" x2="235" y2="235"/>
  <text class="l" x="212" y="228">instr</text>
  <!-- IF/ID -> ID units -->
  <line class="w" x1="253" y1="72" x2="290" y2="72"/>
  <text class="l" x="257" y="67">opcode</text>
  <line class="w" x1="253" y1="200" x2="290" y2="200"/>
  <text class="l" x="260" y="195">rs1</text>
  <line class="w" x1="253" y1="240" x2="290" y2="240"/>
  <text class="l" x="260" y="235">rs2</text>
  <line class="w" x1="253" y1="352" x2="300" y2="352"/>
  <text class="l" x="257" y="347">imm14</text>
  <line class="w" x1="253" y1="112" x2="440" y2="112"/>
  <text class="l" x="330" y="108">PC+4</text>
  <!-- ID -> ID/EX -->
  <line class="w" x1="400" y1="72" x2="440" y2="72"/>
  <text class="l" x="404" y="67">control</text>
  <line class="w" x1="410" y1="200" x2="440" y2="200"/>
  <text class="l" x="412" y="195">data1</text>
  <line class="w" x1="410" y1="250" x2="440" y2="250"/>
  <text class="l" x="412" y="245">data2</text>
  <line class="w" x1="395" y1="352" x2="440" y2="352"/>
  <text class="l" x="402" y="347">imm</text>
  <!-- ID/EX -> EX -->
  <line class="w" x1="458" y1="105" x2="490" y2="105"/>
  <line class="w" x1="458" y1="200" x2="545" y2="200"/>
  <line class="w" x1="458" y1="250" x2="500" y2="250"/>
  <polyline class="w" points="458,352 480,352 480,280 500,280"/>
  <line class="w" x1="522" y1="265" x2="545" y2="265"/>
  <polyline class="w" points="490,250 490,395 665,395"/>
  <circle cx="490" cy="250" r="2.5" fill="#334155"/>
  <text class="l" x="560" y="390">store data (data2)</text>
  <!-- EX -> EX/MEM -->
  <line class="w" x1="600" y1="95" x2="665" y2="95"/>
  <line class="w" x1="625" y1="215" x2="665" y2="215"/>
  <text class="l" x="628" y="210">taken?</text>
  <line class="w" x1="625" y1="255" x2="665" y2="255"/>
  <text class="l" x="628" y="250">result</text>
  <!-- EX/MEM -> MEM -->
  <line class="w" x1="683" y1="255" x2="710" y2="255"/>
  <text class="l" x="686" y="250">addr</text>
  <polyline class="w" points="683,395 760,395 760,290"/>
  <polyline class="w" points="698,255 698,330 860,330"/>
  <circle cx="698" cy="255" r="2.5" fill="#334155"/>
  <text class="l" x="770" y="325">ALU result</text>
  <!-- MEM -> MEM/WB -->
  <line class="w" x1="820" y1="235" x2="860" y2="235"/>
  <text class="l" x="826" y="230">data</text>
  <!-- MEM/WB -> WB mux -->
  <line class="w" x1="878" y1="225" x2="905" y2="225"/>
  <polyline class="w" points="878,330 892,330 892,265 905,265"/>
  <!-- write-back to register file -->
  <polyline class="w" points="927,245 960,245 960,470 275,470 275,285 290,285"/>
  <text class="l" x="560" y="465">write-back value → register rd</text>

  <!-- ===== IF ===== -->
  <rect class="m" x="15" y="200" width="22" height="70" rx="8"/>
  <text class="s" x="26" y="239">M</text>
  <rect class="u" x="50" y="205" width="45" height="60"/>
  <text class="t" x="72" y="239">PC</text>
  <rect class="u" x="115" y="180" width="95" height="110"/>
  <text class="t" x="162" y="230">Instruction</text>
  <text class="t" x="162" y="245">memory</text>
  <rect class="u" x="115" y="70" width="60" height="50"/>
  <text class="t" x="145" y="99">+4</text>

  <!-- ===== ID ===== -->
  <rect class="u" x="290" y="50" width="110" height="45"/>
  <text class="t" x="345" y="76">Control unit</text>
  <rect class="u" x="290" y="170" width="120" height="130"/>
  <text class="t" x="350" y="228">Register file</text>
  <text class="s" x="350" y="244">r0–r15</text>
  <rect class="u" x="300" y="330" width="95" height="45"/>
  <text class="t" x="347" y="350">Sign-extend</text>
  <text class="s" x="347" y="364">14 → 32 bits</text>

  <!-- ===== EX ===== -->
  <rect class="u" x="490" y="70" width="110" height="50"/>
  <text class="t" x="545" y="92">Branch adder</text>
  <text class="s" x="545" y="107">PC+4 + (imm &lt;&lt; 2)</text>
  <rect class="m" x="500" y="235" width="22" height="60" rx="8"/>
  <text class="s" x="511" y="268">M</text>
  <text class="l" x="490" y="310">ALUSrc</text>
  <polygon class="u" points="545,175 625,200 625,270 545,295 545,250 560,235 545,220"/>
  <text class="t" x="595" y="240">ALU</text>

  <!-- ===== MEM ===== -->
  <rect class="u" x="710" y="180" width="110" height="110"/>
  <text class="t" x="765" y="230">Data</text>
  <text class="t" x="765" y="245">memory</text>

  <!-- ===== WB ===== -->
  <rect class="m" x="905" y="205" width="22" height="80" rx="8"/>
  <text class="s" x="916" y="249">M</text>
  <text class="l" x="895" y="300">MemtoReg</text>

  <!-- ===== Pipeline registers ===== -->
  <rect class="p" x="235" y="40" width="18" height="400"/>
  <rect class="p" x="440" y="40" width="18" height="400"/>
  <rect class="p" x="665" y="40" width="18" height="400"/>
  <rect class="p" x="860" y="40" width="18" height="400"/>
  <text class="g" x="244" y="453">IF/ID</text>
  <text class="g" x="449" y="453">ID/EX</text>
  <text class="g" x="674" y="453">EX/MEM</text>
  <text class="g" x="869" y="453">MEM/WB</text>

  <!-- ===== Stage names ===== -->
  <text class="st" x="120" y="500">IF · fetch</text>
  <text class="st" x="345" y="500">ID · decode</text>
  <text class="st" x="560" y="500">EX · execute</text>
  <text class="st" x="770" y="500">MEM · memory</text>
  <text class="st" x="935" y="500">WB</text>
</svg>
